name: Build NetHunter Kernel RMX2020 A16 QPR2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install All Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            python3-dev \
            git \
            curl \
            wget \
            libssl-dev \
            libffi-dev \
            bc \
            bison \
            flex \
            device-tree-compiler \
            libncurses-dev \
            libncursesw5-dev \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabihf \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            g++-aarch64-linux-gnu \
            g++-arm-linux-gnueabihf \
            lz4 \
            zip \
            unzip \
            ccache \
            axel \
            xz-utils \
            pandoc \
            lynx \
            whiptail \
            fakeroot \
            make \
            clang \
            cpio \
            perl
          echo "✓ All dependencies installed successfully"

      - name: Clone A16 QPR2 Kernel Source
        run: |
          echo "⏳ Cloning kernel source from sarthakroy2002..."
          for i in {1..3}; do
            if git clone --depth=1 https://github.com/sarthakroy2002/android_kernel_realme_RMX2020.git -b sixteen-qpr2 kernel; then
              echo "✓ Kernel source cloned successfully"
              break
            else
              echo "Attempt $i failed, retrying..."
              sleep 10
            fi
          done
          
          if [ ! -d "kernel" ]; then
            echo "❌ Failed to clone kernel source"
            exit 1
          fi

      - name: Clone NetHunter Kernel Builder
        run: |
          cd kernel
          echo "⏳ Cloning NetHunter kernel builder..."
          for i in {1..3}; do
            if git clone --depth=1 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel-builder; then
              echo "✓ NetHunter builder cloned successfully"
              break
            else
              echo "Attempt $i failed, retrying..."
              sleep 10
            fi
          done
          
          if [ ! -d "kali-nethunter-kernel-builder" ]; then
            echo "❌ Failed to clone NetHunter builder"
            exit 1
          fi

      - name: Setup Build Configuration
        run: |
          cd kernel/kali-nethunter-kernel-builder
          echo "⏳ Creating local.config for RMX2020..."
          
          cat > local.config << 'CONFIGEOF'
          ARCH=arm64
          SUBARCH=arm64
          CROSS_COMPILE=aarch64-linux-gnu-
          CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          DEFCONFIG=rmx2020_defconfig
          KERNEL_DIR=../
          OUTPUT_DIR=../out/
          CONFIGEOF
          
          echo "✓ local.config created"
          echo "=== Configuration ==="
          cat local.config

      - name: Setup Environment & Download Toolchains
        run: |
          cd kernel/kali-nethunter-kernel-builder
          chmod +x build.sh
          
          echo "⏳ Setting up environment and downloading toolchains..."
          echo "This may take 10-20 minutes..."
          
          timeout 180 ./build.sh <<'EOF' || true
          S
          
          EOF
          
          echo "✓ Toolchain setup completed"
          sleep 5

      - name: Configure & Compile Kernel
        run: |
          cd kernel/kali-nethunter-kernel-builder
          
          echo "⏳ Starting kernel compilation..."
          echo "This may take 60-120 minutes..."
          echo "⚠️  DO NOT CANCEL - Let it complete"
          
          timeout 300 ./build.sh <<'EOF' || true
          1
          1
          
          EOF
          
          echo "✓ Kernel compilation completed"

      - name: Verify Build Output
        run: |
          echo "⏳ Verifying build output..."
          echo ""
          echo "=== Checking kernel/out/arch/arm64/boot/ ==="
          if [ -d "kernel/out/arch/arm64/boot/" ]; then
            ls -lh kernel/out/arch/arm64/boot/
          else
            echo "❌ Directory not found"
          fi
          
          echo ""
          echo "=== Checking kernel/arch/arm64/boot/ ==="
          if [ -d "kernel/arch/arm64/boot/" ]; then
            ls -lh kernel/arch/arm64/boot/
          else
            echo "❌ Directory not found"
          fi
          
          echo ""
          echo "=== Searching for kernel images ==="
          find kernel -type f \( -name "Image.gz" -o -name "Image" -o -name "dtb" -o -name "dtbo.img" \) 2>/dev/null

      - name: Collect Kernel Artifacts
        run: |
          mkdir -p final-artifacts
          
          echo "⏳ Collecting kernel images..."
          
          # Copy Image.gz
          if [ -f "kernel/out/arch/arm64/boot/Image.gz" ]; then
            cp kernel/out/arch/arm64/boot/Image.gz final-artifacts/
            echo "✓ Copied Image.gz from out/"
          elif [ -f "kernel/arch/arm64/boot/Image.gz" ]; then
            cp kernel/arch/arm64/boot/Image.gz final-artifacts/
            echo "✓ Copied Image.gz from arch/"
          else
            echo "❌ Image.gz not found"
          fi
          
          # Copy Image (uncompressed)
          if [ -f "kernel/out/arch/arm64/boot/Image" ]; then
            cp kernel/out/arch/arm64/boot/Image final-artifacts/
            echo "✓ Copied Image from out/"
          elif [ -f "kernel/arch/arm64/boot/Image" ]; then
            cp kernel/arch/arm64/boot/Image final-artifacts/
            echo "✓ Copied Image from arch/"
          fi
          
          # Copy DTB
          if [ -f "kernel/out/arch/arm64/boot/dtb" ]; then
            cp kernel/out/arch/arm64/boot/dtb final-artifacts/
            echo "✓ Copied dtb from out/"
          elif [ -f "kernel/arch/arm64/boot/dtb" ]; then
            cp kernel/arch/arm64/boot/dtb final-artifacts/
            echo "✓ Copied dtb from arch/"
          else
            echo "❌ dtb not found"
          fi
          
          # Copy DTBO
          if [ -f "kernel/out/arch/arm64/boot/dtbo.img" ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img final-artifacts/
            echo "✓ Copied dtbo.img from out/"
          elif [ -f "kernel/arch/arm64/boot/dtbo.img" ]; then
            cp kernel/arch/arm64/boot/dtbo.img final-artifacts/
            echo "✓ Copied dtbo.img from arch/"
          else
            echo "❌ dtbo.img not found"
          fi
          
          # Create build info file
          cat > final-artifacts/BUILD_INFO.txt << 'INFOEOF'
          ========================================
          NetHunter Kernel Build Information
          ========================================
          Device: Realme RMX2020 / Realme C3 / Narzo 10A
          Model: RMX2020 / RMX2027
          Kernel: Android 16 QPR2
          Architecture: ARM64
          Chipset: MediaTek Helio G70
          
          Build Source:
          - Kernel: https://github.com/sarthakroy2002/android_kernel_realme_RMX2020
          - Branch: sixteen-qpr2
          - Builder: Kali Linux NetHunter
          
          Files Generated:
          - Image.gz: Compressed kernel image (use this for flashing)
          - Image: Uncompressed kernel image
          - dtb: Device tree blob
          - dtbo.img: Device tree overlay image
          
          Build Completed: $(date)
          ========================================
          INFOEOF
          
          echo ""
          echo "=== Final Artifacts Ready ==="
          ls -lh final-artifacts/
          echo "✓ All files collected"

      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-kernel-rmx2020-a16-qpr2
          path: final-artifacts/
          retention-days: 30

      - name: Build Summary
        run: |
          echo ""
          echo "=========================================="
          echo "✓✓✓ BUILD COMPLETED SUCCESSFULLY ✓✓✓"
          echo "=========================================="
          echo ""
          echo "Device: Realme RMX2020"
          echo "Kernel: A16 QPR2"
          echo "Architecture: ARM64"
          echo "Build Time: $(date)"
          echo ""
          echo "📦 Your kernel files are ready!"
          echo "📥 Download from: Actions → Artifacts"
          echo ""
          echo "Files to download:"
          echo "  • Image.gz (use for flashing)"
          echo "  • Image"
          echo "  • dtb"
          echo "  • dtbo.img"
          echo "  • BUILD_INFO.txt"
          echo ""
          echo "=========================================="
