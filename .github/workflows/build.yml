name: Build RMX2020 Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 480

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential \
            clang lld llvm \
            libssl-dev libelf-dev \
            libncurses-dev \
            device-tree-compiler \
            pahole cpio \
            python3 python3-dev \
            rsync zip unzip \
            gcc-aarch64-linux-gnu

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            --branch sixteen-qpr2 \
            https://github.com/sarthakroy2002/kernel_realme_RMX2020.git \
            kernel

      - name: Inspect source
        working-directory: kernel
        run: |
          set -eux
          git log -1 --oneline
          git branch --show-current
          test -f Makefile
          find arch/arm64/configs -type f | sort
          grep -nE 'RMX2020|defconfig|clang|CROSS_COMPILE' build.sh 2>/dev/null || true

      - name: Prepare configuration
        working-directory: kernel
        run: |
          set -eux
          mkdir -p out
          make O=out ARCH=arm64 RMX2020_defconfig

      - name: Build kernel
        working-directory: kernel
        run: |
          set -eux
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1

      - name: Verify output
        working-directory: kernel
        run: |
          set -eux
          test -f out/.config
          find out/arch/arm64/boot -maxdepth 3 -type f -print
          test -f out/arch/arm64/boot/Image || \
            test -f out/arch/arm64/boot/Image.gz

      - name: Prepare artifacts
        run: |
          set -eux
          mkdir -p artifacts

          cp kernel/out/.config artifacts/

          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz artifacts/
          fi

          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image artifacts/
          fi

          find kernel/out/arch/arm64/boot \
            -type f \
            \( -name '*.dtb' -o -name 'dtb' -o -name 'dtbo.img' \) \
            -exec cp --parents {} artifacts/ \; || true

          {
            echo "Branch: sixteen-qpr2"
            echo "Commit:"
            git -C kernel rev-parse HEAD
            echo "Kernel version:"
            make -C kernel O=out kernelversion
            echo "Build date:"
            date -u
          } > artifacts/BUILD_INFO.txt

          find artifacts -type f -ls

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rmx2020-kernel-build
          path: artifacts/
          retention-days: 30
