name: Build NetHunter Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4

      - name: Maximize Build Space & Create SWAP (Fix OOM)
        run: |
          sudo swapoff -a
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "SWAP Memory configured successfully!"

      - name: Install Build Dependencies
        run: |
          sudo add-apt-repository universe
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses-dev libssl-dev xz-utils bison flex libelf-dev clang lld git gcc-aarch64-linux-gnu

      - name: Pull Kernel Source
        run: |
          git clone --depth=1 -b sixteen https://github.com/sarthakroy2002/kernel_realme_RMX2020 kernel-source

      - name: Fix Code Errors Automatically
        run: |
          # Fix modpost.c syntax/compiler error directly
          if [ -f kernel-source/scripts/mod/modpost.c ]; then
            sed -i 's/extern inline/static inline/g' kernel-source/scripts/mod/modpost.c
          fi

          # Fix resmap_account inline error
          sed -i 's/extern inline unsigned long vm_mmap_pgoff_with_check/unsigned long vm_mmap_pgoff_with_check/g' kernel-source/include/linux/resmap_account.h
          
          # Fix keyslot-manager inline error
          sed -i 's/inline void ksm_flock/void ksm_flock/g' kernel-source/include/linux/keyslot-manager.h

          # Fix mtk_hdmi inline errors if files exist
          if [ -f kernel-source/drivers/misc/mediatek/hdmi/mtk_hdmi_priv.h ]; then
            sed -i 's/inline void mtk_hdmi_vdo_output/void mtk_hdmi_vdo_output/g' kernel-source/drivers/misc/mediatek/hdmi/mtk_hdmi_priv.h
          fi
          if [ -f kernel-source/drivers/misc/mediatek/hdmi/mtk_hdmi.h ]; then
            sed -i 's/inline void mtk_hdmi_vdo_output/void mtk_hdmi_vdo_output/g' kernel-source/drivers/misc/mediatek/hdmi/mtk_hdmi.h
          fi

          # Fix mtk_imgsensor inline/multiple definition error
          if [ -f kernel-source/drivers/misc/mediatek/imgsensor/inc/kd_imgsensor.h ]; then
            sed -i 's/inline int kdSetSpeed/static int kdSetSpeed/g' kernel-source/drivers/misc/mediatek/imgsensor/inc/kd_imgsensor.h
          fi
          if [ -f kernel-source/drivers/misc/mediatek/imgsensor/src/common/v1/kd_imgsensor.c ]; then
            sed -i 's/inline int kdSetSpeed/static int kdSetSpeed/g' kernel-source/drivers/misc/mediatek/imgsensor/src/common/v1/kd_imgsensor.c
          fi

          # Fix mtk_connectivity (wlan) multiple definition error
          if [ -f kernel-source/drivers/misc/mediatek/connectivity/wlan/gen4/gl_rst.h ]; then
            sed -i 's/inline uint32_t gl_rst_bus_read_32/static uint32_t gl_rst_bus_read_32/g' kernel-source/drivers/misc/mediatek/connectivity/wlan/gen4/gl_rst.h
          fi
          if [ -f kernel-source/drivers/misc/mediatek/connectivity/wlan/gen4/gl_rst.c ]; then
            sed -i 's/inline uint32_t gl_rst_bus_read_32/static uint32_t gl_rst_bus_read_32/g' kernel-source/drivers/misc/mediatek/connectivity/wlan/gen4/gl_rst.c
          fi

      - name: Build Kernel
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu
          export CROSS_COMPILE_COMPAT=aarch64-linux-gnu
          export CC=clang
          export LD=ld.lld
          
          # Modpost স্ক্রিপ্ট জেনারেট করার জন্য হোস্ট কম্পাইলার ডিফাইন করা হলো
          export HOSTCC=gcc
          export HOSTRM=rm
          
          make O=out RMX2020_defconfig
          make -j1 O=out
          
      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-RMX2020
          path: kernel-source/out/arch/arm64/boot/Image.gz-dtb
