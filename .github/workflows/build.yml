name: Build NetHunter PixelOS RMX2020 (Fixed)

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Maximize Environment Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk /usr/share/swift
          
      - name: Run Android Kernel Build Pipeline
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com
          kernel-branch: sixteen
          config: RMX2020_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 14
          
          # Native NetHunter Engine Injections
          nethunter: true
          nethunter-patch: true
          
          # Extra configs override for missing wireless modules
          merge-configs: |
            [
              "https://githubusercontent.com"
            ]
            
          anykernel3: true
